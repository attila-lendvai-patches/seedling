name: CI

on:
  push:
    branches:
      - master
      - staging
      - attila
    paths-ignore:
      - '**.md'

  pull_request:
    branches:
      - master
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              qemu-user-static binfmt-support elfutils libz80ex-dev \
              build-essential git

      - name: Enable binfmt for foreign architectures
        run: |
          for handler in qemu-x86_64 qemu-i386 qemu-aarch64; do
              sudo update-binfmts --enable "$handler" 2>/dev/null || true
          done

      - name: Run test suite
        run: bash tools-for-build/test.sh

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-${{ matrix.os }}
          path: |
            tools-for-build/build/
            seed/bin/
          if-no-files-found: ignore

